# nvgd: driver nativo para GPUs NVIDIA Turing e mais recentes (GTX Serie 16+)
# Add nvgd for the kernel being built only when DKMS actually installed it.
# Avoid pinning this to a kernel minor (which left 7.3 without a GPU driver).
if modinfo -k "$KERNELVERSION" -n nvgd &>/dev/null; then
    MODULES+=(nvgd)
    FILES+=(/usr/lib/firmware/nvidia/ga102/gsp/sec2-bl-615.78.08.bin
            /usr/lib/firmware/nvidia/ga102/gsp/ucodes-615.78.08.bin.zst)
fi
