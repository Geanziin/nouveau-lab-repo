PACKAGE_NAME="nvgd"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="nvgd"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -j10 KDIR=${kernel_source_dir}"
# Do not silently skip a new minor kernel after a system upgrade. The Arch
# DKMS hook reads the regex, while DKMS also enforces the minimum version.
BUILD_EXCLUSIVE_KERNEL="^([7-9]|[1-9][0-9]+)\."
BUILD_EXCLUSIVE_KERNEL_MIN="7.2"
AUTOINSTALL="yes"
